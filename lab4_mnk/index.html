<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Лабораторная работа 4</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ========== ЗАДАНИЕ 1 ========== -->
    <section class="task1">
        <h2>Задание 1. Паровоз</h2>

        <div class="picture">
            <div class="sun"></div>

            <div class="train">
                <!-- дым -->
                <div class="smoke smoke1"></div>
                <div class="smoke smoke2"></div>
                <div class="smoke smoke3"></div>

                <!-- труба -->
                <div class="chimney-top"></div>
                <div class="chimney"></div>

                <!-- котёл -->
                <div class="dome"></div>
                <div class="boiler">
                    <div class="band band1"></div>
                    <div class="band band2"></div>
                    <div class="band band3"></div>
                </div>
                <div class="smokebox"></div>
                <div class="lamp"></div>

                <!-- кабина -->
                <div class="roof"></div>
                <div class="cabin">
                    <div class="window"></div>
                </div>

                <!-- рама и путеочиститель -->
                <div class="frame"></div>
                <div class="cowcatcher"></div>

                <!-- колёса -->
                <div class="wheel small"></div>
                <div class="wheel big w1"></div>
                <div class="wheel big w2"></div>
                <div class="wheel big w3"></div>
                <div class="rod"></div>
            </div>

            <!-- рельсы -->
            <div class="rails"></div>
            <div class="sleepers"></div>
            <div class="ground"></div>
        </div>
    </section>

    <!-- ========== ЗАДАНИЕ 2 ========== -->
    <section class="task2">
        <h2>Задание 2. Химическая реакция: O<sub>2</sub> + 2H<sub>2</sub> = 2H<sub>2</sub>O</h2>
        <p class="hint">Наведите мышку на колбу, чтобы поставить анимацию на паузу.</p>

        <div class="flask">
            <!-- подписи этапов -->
            <div class="label label1">O<sub>2</sub> + 2H<sub>2</sub></div>
            <div class="label label2">Реакция!</div>
            <div class="label label3">2H<sub>2</sub>O</div>

            <!-- вспышка в момент реакции -->
            <div class="flash"></div>

            <!-- атомы кислорода -->
            <div class="atom oxygen o1">O</div>
            <div class="atom oxygen o2">O</div>

            <!-- атомы водорода -->
            <div class="atom hydrogen h1">H</div>
            <div class="atom hydrogen h2">H</div>
            <div class="atom hydrogen h3">H</div>
            <div class="atom hydrogen h4">H</div>
        </div>

        <div class="legend">
            <div class="legend-item"><span class="dot red"></span> Кислород (O)</div>
            <div class="legend-item"><span class="dot white"></span> Водород (H)</div>
        </div>
    </section>

</body>
</html>
