<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация брака</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="wrapper">

    <h1>Заявление о регистрации брака</h1>

    <!-- novalidate: отключаем встроенные подсказки браузера, проверку делает script.js -->
    <form id="marriage-form" action="#" method="post" novalidate>

        <fieldset>
            <legend>Жених</legend>

            <div class="field">
                <label for="groom-surname">Фамилия:</label>
                <input type="text" id="groom-surname" placeholder="Фамилия жениха">
            </div>

            <div class="field">
                <label for="groom-name">Имя:</label>
                <input type="text" id="groom-name" placeholder="Имя жениха">
            </div>

            <div class="field">
                <label for="groom-patronymic">Отчество:</label>
                <input type="text" id="groom-patronymic" placeholder="Отчество жениха (необязательно)">
            </div>

            <div class="field visible">
                <label for="groom-birth">Дата рождения:</label>
                <input type="date" id="groom-birth">
            </div>

            <div class="field">
                <label for="groom-passport">Паспорт:</label>
                <input type="text" id="groom-passport" placeholder="Серия и номер: 0000 000000" maxlength="11">
            </div>
        </fieldset>

        <fieldset>
            <legend>Невеста</legend>

            <div class="field">
                <label for="bride-surname">Фамилия:</label>
                <input type="text" id="bride-surname" placeholder="Фамилия невесты">
            </div>

            <div class="field">
                <label for="bride-name">Имя:</label>
                <input type="text" id="bride-name" placeholder="Имя невесты">
            </div>

            <div class="field">
                <label for="bride-patronymic">Отчество:</label>
                <input type="text" id="bride-patronymic" placeholder="Отчество невесты (необязательно)">
            </div>

            <div class="field visible">
                <label for="bride-birth">Дата рождения:</label>
                <input type="date" id="bride-birth">
            </div>

            <div class="field">
                <label for="bride-passport">Паспорт:</label>
                <input type="text" id="bride-passport" placeholder="Серия и номер: 0000 000000" maxlength="11">
            </div>

            <div class="field visible">
                <span class="title">Фамилия после брака:</span>
                <div class="options">
                    <label><input type="radio" name="surname" value="Своя"> Своя</label>
                    <label><input type="radio" name="surname" value="Мужа" checked> Мужа</label>
                    <label><input type="radio" name="surname" value="Двойная"> Двойная</label>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Регистрация</legend>

            <div class="field visible">
                <label for="office">Отдел ЗАГС:</label>
                <select id="office">
                    <option value="">-- выберите --</option>
                    <optgroup label="Дворцы бракосочетания">
                        <option>Дворец № 1</option>
                        <option>Дворец № 2</option>
                    </optgroup>
                    <optgroup label="Районные отделы">
                        <option>Центральный район</option>
                        <option>Северный район</option>
                    </optgroup>
                </select>
            </div>

            <div class="field visible">
                <label for="wed-date">Дата регистрации:</label>
                <input type="date" id="wed-date">
            </div>

            <div class="field">
                <label for="guests">Количество гостей:</label>
                <input type="number" id="guests" placeholder="Количество гостей (0–50)">
            </div>

            <div class="field visible">
                <span class="title">Церемония:</span>
                <div class="options">
                    <label><input type="radio" name="ceremony" value="Торжественная" checked> Торжественная</label>
                    <label><input type="radio" name="ceremony" value="Без церемонии"> Без церемонии</label>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Контакты</legend>

            <div class="field">
                <label for="phone">Телефон:</label>
                <input type="tel" id="phone" placeholder="+7 900 123-45-67">
            </div>

            <div class="field">
                <label for="email">Email:</label>
                <input type="email" id="email" placeholder="Электронная почта">
            </div>

            <div class="field">
                <label for="comment">Комментарий:</label>
                <textarea id="comment" placeholder="Комментарий или пожелания (до 500 символов)"></textarea>
            </div>
        </fieldset>

        <div class="agree">
            <label>
                <input type="checkbox" id="agree">
                Согласны на обработку персональных данных
            </label>
        </div>

        <div class="buttons">
            <button type="submit">Отправить</button>
            <button type="reset">Сбросить</button>
        </div>

    </form>

    <!-- Сюда выводятся данные после успешной отправки -->
    <div id="result" class="result" hidden></div>

</div>

<script src="script.js"></script>
</body>
</html>
